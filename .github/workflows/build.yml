name: Build Xbox UWP package

on:
  workflow_dispatch:
    inputs:
      with_qemu:
        description: "Include the QEMU DLL (takes about 20 minutes). Untick for a quick app-only build."
        type: boolean
        default: true
      reuse_run:
        description: "Only when the QEMU box is unticked: the number of an earlier run whose QEMU files should be reused (the number at the end of that run's web address)."
        type: string
        default: ""
      gpu_probe:
        description: "Virgl check only (no app, no QEMU DLL): tries to build the graphics pieces and reports what works on the Summary page."
        type: boolean
        default: false
      make_release:
        description: "Also publish the finished package as a public Release (a download page anyone can use without a GitHub account)."
        type: boolean
        default: false

jobs:
  gpu_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu_probe }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up the MSYS2 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make diffutils
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libslirp

      - name: 1. Which graphics packages does MSYS2 offer?
        id: pkgs
        continue-on-error: true
        run: |
          S=$(cygpath -u "$GITHUB_STEP_SUMMARY")
          { echo '## Virgl check (Stage 1)'; echo; echo '### 1. Packages MSYS2 offers (virgl, epoxy, angle)'; echo '```'; } >> "$S"
          pacman -Ss 'virgl|epoxy|angle' 2>&1 | grep -i 'ucrt64\|ucrt-x86_64' | head -40 >> "$S" || true
          echo '```' >> "$S"
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-libepoxy 2>&1 | tail -5

      - name: 2. Build virglrenderer from source
        id: virgl
        continue-on-error: true
        run: |
          set -o pipefail
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-python-yaml mingw-w64-ucrt-x86_64-libepoxy
          git clone --depth 1 https://gitlab.freedesktop.org/virgl/virglrenderer.git virgl-src
          cd virgl-src
          git log -1 --format='virglrenderer commit %h %ad' --date=short
          # Windows has no <sys/ioccom.h> (Linux/BSD DRM header). The ioctls are never used here, so a stand-in is enough to compile.
          mkdir -p ../shim/sys
          cat > ../shim/sys/ioccom.h <<'HDREOF'
          #ifndef SHIM_IOCCOM_H
          #define SHIM_IOCCOM_H
          #define _IOC(dir,type,nr,size) (((dir)<<30)|((size)<<16)|((type)<<8)|(nr))
          #define _IO(g,n) _IOC(0,(g),(n),0)
          #define _IOR(g,n,t) _IOC(2,(g),(n),sizeof(t))
          #define _IOW(g,n,t) _IOC(1,(g),(n),sizeof(t))
          #define _IOWR(g,n,t) _IOC(3,(g),(n),sizeof(t))
          #endif
          HDREOF
          export CFLAGS="-I$PWD/../shim"
          meson setup build --prefix="$MSYSTEM_PREFIX" -Dtests=false -Dplatforms=egl 2>&1 | tee ../virgl-setup.log
          ninja -C build 2>&1 | tee ../virgl-build.log
          ninja -C build install 2>&1 | tail -5

      - name: 3. Get QEMU 10.0.0 and try to configure it with Virgl
        id: qemucfg
        continue-on-error: true
        run: |
          set -o pipefail
          git clone --depth 1 --branch v10.0.0 https://github.com/qemu/qemu.git qemu-src
          python -m pip install --break-system-packages pycotap
          mkdir -p qemu-src/build
          cd qemu-src/build
          ../configure --static --target-list=x86_64-softmmu --without-default-features --enable-tcg --enable-slirp --enable-opengl --enable-virglrenderer --disable-werror 2>&1 | tee configure.log

      - name: 4. Compile QEMU's Virgl graphics device
        id: qemubuild
        continue-on-error: true
        run: |
          set -o pipefail
          cd qemu-src/build
          T=$(ninja -t targets all | grep -i 'virtio-gpu-virgl.c.o' | head -1 | cut -d: -f1)
          echo "target: $T"
          test -n "$T"
          ninja "$T" 2>&1 | tee build.log

      - name: Put the results on the Summary page
        if: always()
        run: |
          set +e
          S=$(cygpath -u "$GITHUB_STEP_SUMMARY")
          {
            echo
            echo '### Results'
            echo "- 1. packages listed: ${{ steps.pkgs.outcome }}"
            echo "- 2. virglrenderer builds: ${{ steps.virgl.outcome }}"
            echo "- 3. QEMU configure with Virgl: ${{ steps.qemucfg.outcome }}"
            echo "- 4. QEMU Virgl device compiles: ${{ steps.qemubuild.outcome }}"
          } >> "$S"
          # Also post each result as a short note (annotation) so it can be read without opening the logs.
          note() { m=$(printf '%s' "$2" | cut -c1-300 | tr '\r' ' ' | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::notice title=$1::$m"; }
          note "RESULT 1 packages" "${{ steps.pkgs.outcome }}"
          note "RESULT 2 virglrenderer build" "${{ steps.virgl.outcome }}"
          note "RESULT 3 QEMU configure with Virgl" "${{ steps.qemucfg.outcome }}"
          note "RESULT 4 QEMU Virgl device compile" "${{ steps.qemubuild.outcome }}"
          for f in virgl-setup.log virgl-build.log qemu-src/build/configure.log qemu-src/build/build.log; do
            if [ -f "$f" ]; then
              body=$(tail -n 12 "$f" | cut -c1-220 | tr '\r' ' ')
              m=$(printf '%s' "$body" | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::notice title=LOG TAIL $f::$m"
              { echo "#### $f"; echo '```'; tail -n 30 "$f"; echo '```'; } >> "$S"
            else
              echo "::notice title=LOG TAIL $f::file does not exist (step did not get that far)"
            fi
          done
          exit 0

  qemu:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.with_qemu && !inputs.gpu_probe) }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up the MSYS2 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make diffutils
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-ccache

      - name: Restore the compiled QEMU files from earlier builds
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-qemu-${{ github.run_id }}
          restore-keys: |
            ccache-qemu-

      - name: Point the compile cache at that folder
        run: |
          E=$(cygpath -u "$GITHUB_ENV")
          echo "CCACHE_DIR=$(cygpath -u "$GITHUB_WORKSPACE")/.ccache" >> "$E"
          echo "CCACHE_MAXSIZE=1500M" >> "$E"
          echo "CCACHE_BASEDIR=$(cygpath -u "$GITHUB_WORKSPACE")" >> "$E"
          echo "CCACHE_NOHASHDIR=1" >> "$E"

      - name: Install the Python helper QEMU needs
        run: python -m pip install --break-system-packages pycotap

      - name: Build virglrenderer (translates the guest's graphics calls) as a static library
        run: |
          set -eo pipefail
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-python-yaml mingw-w64-ucrt-x86_64-libepoxy
          git clone --depth 1 https://gitlab.freedesktop.org/virgl/virglrenderer.git virgl-src
          git -C virgl-src log -1 --format='virglrenderer commit %h %ad' --date=short
          python native/patch_virgl_for_angle.py || { echo "VIRGL PATCH FAILED"; cat virgl-patch.txt 2>/dev/null; echo "::error title=virglrenderer patch failed::$(head -c 1500 virgl-patch.txt 2>/dev/null | tr '\n' ' ')"; exit 1; }
          # Windows has no <sys/ioccom.h> (Linux/BSD DRM header). The ioctls are never used here, so a stand-in is enough to compile.
          mkdir -p shim/sys
          cat > shim/sys/ioccom.h <<'HDREOF'
          #ifndef SHIM_IOCCOM_H
          #define SHIM_IOCCOM_H
          #define _IOC(dir,type,nr,size) (((dir)<<30)|((size)<<16)|((type)<<8)|(nr))
          #define _IO(g,n) _IOC(0,(g),(n),0)
          #define _IOR(g,n,t) _IOC(2,(g),(n),sizeof(t))
          #define _IOW(g,n,t) _IOC(1,(g),(n),sizeof(t))
          #define _IOWR(g,n,t) _IOC(3,(g),(n),sizeof(t))
          #endif
          HDREOF
          cd virgl-src
          CFLAGS="-I$PWD/../shim" meson setup build --prefix="$MSYSTEM_PREFIX" -Dtests=false -Dplatforms=egl --default-library=static
          ninja -C build
          ninja -C build install
          pkg-config --modversion virglrenderer
          pkg-config --static --libs virglrenderer

      - name: Get the QEMU source
        run: git clone --depth 1 --branch v10.0.0 https://github.com/qemu/qemu.git qemu-src

      - name: Rename QEMU's main() so start-up code only runs once
        run: |
          set -e
          sed -i 's/^int main(int argc, char \*\*argv)/int qemu_real_main(int argc, char **argv)/' qemu-src/system/main.c
          grep -n "qemu_real_main" qemu-src/system/main.c
          # Also let our screen/keyboard code start up right before QEMU's main loop begins.
          sed -i 's/^#include "system\/system.h"/#include "system\/system.h"\nvoid uwp_after_init(void);/' qemu-src/system/main.c
          sed -i 's/^    status = qemu_main_loop();/    uwp_after_init();\n    status = qemu_main_loop();/' qemu-src/system/main.c
          grep -n "uwp_after_init" qemu-src/system/main.c
          test "$(grep -c uwp_after_init qemu-src/system/main.c)" = "2"

      - name: Skip QEMU's Direct3D device lookup (the OpenGL loader cannot resolve it before a context exists)
        run: |
          set -e
          sed -i 's/^#ifdef EGL_D3D11_DEVICE_ANGLE/#if 0 \/* EGL_D3D11_DEVICE_ANGLE skipped for the Xbox app *\//' qemu-src/ui/egl-helpers.c
          grep -n "EGL_D3D11_DEVICE_ANGLE skipped" qemu-src/ui/egl-helpers.c
          test "$(grep -c 'EGL_D3D11_DEVICE_ANGLE skipped' qemu-src/ui/egl-helpers.c)" = "1"

      - name: Make QEMU's OpenGL helper code work with ANGLE (OpenGL ES 3 on Direct3D 11)
        run: |
          set -e
          python native/patch_egl_for_angle.py

      - name: Let QEMU's code generator use the memory calls an Xbox app is allowed to use
        run: |
          set -e
          python - <<'PYEOF'
          p = "qemu-src/tcg/region.c"
          s = open(p).read()
          old = "buf = VirtualAlloc(NULL, size, MEM_RESERVE | MEM_COMMIT,\n                             PAGE_EXECUTE_READWRITE);"
          if old not in s:
              raise SystemExit("could not find the VirtualAlloc call in tcg/region.c")
          s = s.replace(old, "buf = uwp_jit_alloc(size);")
          s = s.replace("static int alloc_code_gen_buffer(size_t size, int splitwx, Error **errp)\n{\n    void *buf;\n\n    if (splitwx > 0) {\n        error_setg(errp, \"jit split-wx not supported\");", "extern void *uwp_jit_alloc(size_t size);\nstatic int alloc_code_gen_buffer(size_t size, int splitwx, Error **errp)\n{\n    void *buf;\n\n    if (splitwx > 0) {\n        error_setg(errp, \"jit split-wx not supported\");", 1)
          open(p, "w").write(s)
          # Disk files: UWP apps may not ask Windows for the sector size, so GetDiskFreeSpace
          # fails and leaves garbage. Start from 512 so a failed call still gives a valid value.
          p2 = "qemu-src/block/file-win32.c"
          t = open(p2).read()
          old2 = "        GetDiskFreeSpace(s->drive_path, &sectorsPerCluster,"
          if t.count(old2) != 1:
              raise SystemExit("could not find GetDiskFreeSpace in block/file-win32.c")
          t = t.replace(old2, "        dg.Geometry.BytesPerSector = 512;\n" + old2)
          # If the call "succeeds" but hands back 0 or an odd number, use 512 as well.
          old3 = "&freeClusters, &totalClusters);\n        bs->bl.request_alignment = dg.Geometry.BytesPerSector;\n"
          if t.count(old3) != 1:
              raise SystemExit("could not find the alignment assignment in block/file-win32.c")
          t = t.replace(old3, old3 + "        if (bs->bl.request_alignment == 0 || (bs->bl.request_alignment & (bs->bl.request_alignment - 1))) {\n            bs->bl.request_alignment = 512;\n        }\n")
          open(p2, "w").write(t)
          PYEOF
          grep -n "uwp_jit_alloc" qemu-src/tcg/region.c
          grep -n "BytesPerSector = 512" qemu-src/block/file-win32.c

      - name: Configure QEMU
        run: |
          set -o pipefail
          mkdir -p qemu-src/build
          cd qemu-src/build
          ../configure --cc="ccache gcc" --static --target-list=x86_64-softmmu --without-default-features --enable-tcg --enable-slirp --enable-opengl --enable-virglrenderer --disable-werror 2>&1 | tee configure.log

      - name: Build QEMU
        run: |
          set -o pipefail
          cd qemu-src/build
          # The last step (linking the .exe) is expected to fail on a missing iconv library.
          # Everything is compiled by then, and the next step does the final link itself.
          make -j4 qemu-system-x86_64.exe 2>&1 | tee build.log || echo "NOTE: make reported a problem (expected if only the final link failed)"
          ccache -s 2>&1 | tee ccache-stats.txt || true

      - name: Keep the compiled QEMU files for the next build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-qemu-${{ github.run_id }}

      - name: Find the UWP-allowed function list (WindowsApp.lib)
        shell: pwsh
        run: |
          $lib = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -Recurse -Filter WindowsApp.lib | Where-Object { $_.FullName -match "\\um\\x64\\" } | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Found: $lib"
          "WINDOWSAPP_LIB=$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Turn QEMU into a DLL
        run: |
          set -e
          cd qemu-src/build
          gcc -O2 -c -o uwp_entry.o ../../native/uwp_entry.c
          gcc -O2 -c -o uwp_shim.o ../../native/uwp_shim.c
          gcc -O2 -c -o uwp_jit.o ../../native/uwp_jit.c
          python ../../native/compile_like_qemu.py ../../native/uwp_display.c uwp_display.o
          # QEMU's own build left the egl-headless display out (no object file for it), so compile it here the same way.
          python ../../native/compile_like_qemu.py ../ui/egl-headless.c egl_headless.o || echo "NOTE: egl-headless.c did not compile"
          ls -l egl_headless.o || true
          rm -f qemu-system-x86_64.exe
          ninja -d keeprsp qemu-system-x86_64.exe || echo "NOTE: exe link failed again (expected); continuing with the DLL link"
          ls -l qemu-system-x86_64.exe.rsp
          echo "Start of the response file:"; head -c 1500 qemu-system-x86_64.exe.rsp; echo
          python - <<'PYEOF'
          import re, os
          s = open("qemu-system-x86_64.exe.rsp").read()
          s2, n = re.subn(r'(?:"-o"|-o)\s+"?qemu-system-x86_64\.exe"?', '-shared -o qemu.dll uwp_entry.o uwp_shim.o uwp_jit.o uwp_display.o', s)
          print("replacements:", n)
          if n != 1:
              raise SystemExit("could not find the -o option in the response file")
          # libintl (linked in statically) needs iconv, and the configure step did not add it.
          import subprocess
          wa = subprocess.check_output(["cygpath", "-m", os.environ["WINDOWSAPP_LIB"]]).decode().strip()
          # WindowsApp.lib goes last, so it only supplies what nothing else does (VirtualAllocFromApp and friends).
          s2 = s2.rstrip() + "\n-Wl,--wrap=exit\n-Wl,-Bstatic\n-liconv\n-Wl,-Bdynamic\n\"" + wa + "\"\n"
          # QEMU's build did not compile the egl-headless display; we compiled it ourselves (egl_headless.o).
          extra = ["egl_headless.o"] if os.path.exists("egl_headless.o") else []
          allnames = []
          for root, dirs, files in os.walk("."):
              for f in files:
                  if ("egl" in f or "virtio-gpu" in f or "virtio-vga" in f) and f.endswith((".obj", ".o")):
                      allnames.append(f)
          print("extra objects for the link:", extra)
          open("forced-objects.txt", "w").write(" ".join(extra) + "\n\nall candidates: " + " ".join(sorted(allnames)) + "\n")
          open("qemu-dll-plain.rsp", "w").write(s2)
          s2 = "\n".join('"%s"' % x for x in extra) + "\n" + s2
          open("qemu-dll.rsp", "w").write(s2)
          PYEOF
          set +e
          cc -m64 @qemu-dll.rsp > dll-link.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "FORCED-OBJECT LINK FAILED (code $rc); linking again without the forced objects"
            echo "FORCED-OBJECT LINK FAILED (code $rc), fell back to a plain link" > forced-link-status.txt
            cc -m64 @qemu-dll-plain.rsp
          else
            echo "forced-object link OK" > forced-link-status.txt
          fi
          ls -l qemu.dll

      - name: Check the DLL against the UWP-allowed list
        id: audit
        continue-on-error: true
        run: |
          python -m pip install --break-system-packages pefile
          cp "$(cygpath -u "$WINDOWSAPP_LIB")" windowsapp.lib
          nm -g windowsapp.lib > windowsapp_symbols.txt 2>/dev/null || true
          for f in CreateFiberEx ConvertThreadToFiberEx WaitForMultipleObjectsEx SetLastError LoadPackagedLibrary MultiByteToWideChar; do
            if grep -qw "$f" windowsapp_symbols.txt; then echo "allowed: $f"; else echo "MISSING from allowed list: $f"; fi
          done
          python native/uwp_audit.py qemu-src/build/qemu.dll windowsapp_symbols.txt "$MSYSTEM_PREFIX/bin" 2>&1 | tee uwp-audit.txt

      - name: What graphics code is inside qemu.dll
        id: gfxsyms
        continue-on-error: true
        run: |
          {
            echo "virgl_renderer_ functions in qemu.dll: $(nm qemu-src/build/qemu.dll | grep -c ' [TtDd] _\?virgl_renderer_')"
            echo "epoxy_ symbols in qemu.dll: $(nm qemu-src/build/qemu.dll | grep -c 'epoxy_')"
            echo "egl_init / qemu_egl_ symbols: $(nm qemu-src/build/qemu.dll | grep -c 'egl_init\|qemu_egl_')"
            echo "egl_headless / virtio_gpu_gl symbols: $(nm qemu-src/build/qemu.dll | grep -ci 'egl_headless\|virtio_gpu_gl\|virtio_gpu_virgl')"
            echo "forced objects: $(cat qemu-src/build/forced-objects.txt | tr '\n' ' ')"; grep -n "egl-headless\|virtio-gpu-gl" qemu-src/build/build.ninja | head -5
            echo "register_egl / qemu_display_egl symbols: $(nm qemu-src/build/qemu.dll | grep -c 'register_egl\|qemu_display_egl\|egl_headless')"
            echo "LoadLibrary mentions in qemu.dll imports:"; objdump -p qemu-src/build/qemu.dll | grep -i 'LoadLibrary\|DLL Name' | head -30
          } 2>&1 | tee gfx-symbols.txt

      - name: Post the check result as readable notes (annotations)
        if: always()
        run: |
          set +e
          emit() {
            python - "$1" "$2" "$3" <<'PYEOF'
          import sys
          t, f, tail = sys.argv[1], sys.argv[2], int(sys.argv[3])
          try:
              s = open(f, errors="replace").read().replace("\r", "")
          except Exception:
              print("::notice title=%s::file missing: %s" % (t, f)); sys.exit(0)
          lines = s.split("\n")
          if tail:
              lines = lines[-tail:]
          chunks, cur = [], ""
          for line in lines:
              line = line[:300]
              if len(cur) + len(line) + 1 > 3000:
                  chunks.append(cur); cur = ""
              cur += line + "\n"
          if cur:
              chunks.append(cur)
          for i, c in enumerate(chunks[:8]):
              m = c.replace("%", "%25").replace("\n", "%0A")
              print("::notice title=%s (%d/%d)::%s" % (t, i + 1, len(chunks), m))
          PYEOF
          }
          echo "::notice title=AUDIT OUTCOME::${{ steps.audit.outcome }}"
          emit "VIRGL PATCH" virgl-patch.txt 0
          emit "VIRGL SAMPLER CODE" virgl-dump.txt 0
          emit "COMPILE CACHE" qemu-src/build/ccache-stats.txt 0
          emit "UWP AUDIT REPORT" uwp-audit.txt 0
          emit "GRAPHICS CODE IN QEMU.DLL" gfx-symbols.txt 0
          emit "FORCED LINK STATUS" qemu-src/build/forced-link-status.txt 0
          emit "FORCED LINK ERRORS (tail)" qemu-src/build/dll-link.log 30
          emit "QEMU CONFIGURE (tail)" qemu-src/build/configure.log 25
          emit "QEMU BUILD (tail)" qemu-src/build/build.log 40
          exit 0

      - name: Put the check report on the Summary page
        if: always()
        run: |
          S=$(cygpath -u "$GITHUB_STEP_SUMMARY")
          {
            echo '## QEMU DLL: UWP check'
            echo '```'
            if [ -f uwp-audit.txt ]; then head -c 60000 uwp-audit.txt; else echo "No report (an earlier step failed)."; fi
            echo '```'
          } >> "$S"

      - name: Collect the DLL (only if it passed the check)
        if: always()
        run: |
          mkdir -p qemudll
          cp uwp-audit.txt qemudll/ 2>/dev/null || true
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            cp qemu-src/build/qemu.dll qemudll/
            mkdir -p qemudll/pc-bios
            for f in bios-256k.bin bios.bin kvmvapic.bin linuxboot_dma.bin multiboot_dma.bin pvh.bin vgabios.bin vgabios-stdvga.bin vgabios-cirrus.bin vgabios-virtio.bin; do
              cp qemu-src/pc-bios/$f qemudll/pc-bios/ || echo "missing firmware file: $f"
            done
            ls -l qemudll/pc-bios
            for d in $(ldd qemu-src/build/qemu.dll | grep -i ucrt64 | awk '{print $3}'); do cp "$d" qemudll/; done
            echo "DLL passed the check and was collected."
          else
            echo "DLL did NOT pass the check (or was not built), so it is left out of the app."
          fi
          ls -l qemudll

      - name: Show the last lines of any failure
        if: failure()
        run: |
          S=$(cygpath -u "$GITHUB_STEP_SUMMARY")
          {
            echo '## QEMU DLL build problem (last lines)'
            echo '```'
            tail -n 40 qemu-src/build/configure.log 2>/dev/null
            tail -n 60 qemu-src/build/build.log 2>/dev/null
            echo '```'
          } >> "$S"

      - name: Save the DLL files
        uses: actions/upload-artifact@v4
        with:
          name: qemudll
          path: qemudll/
          retention-days: 14
          if-no-files-found: warn

  build:
    needs: qemu
    permissions:
      contents: write
      actions: read
    if: ${{ !cancelled() && !inputs.gpu_probe }}
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the QEMU DLL files built by the other job
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qemudll
          path: qemudll

      - name: Or reuse the QEMU DLL files from an earlier run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.with_qemu && inputs.reuse_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: qemudll
          path: qemudll
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}

      - name: Put the QEMU DLL files next to the app
        shell: pwsh
        run: |
          if (Test-Path qemudll) { Get-ChildItem qemudll -Filter *.dll | Move-Item -Destination . -Force }
          if (Test-Path qemudll\pc-bios) { New-Item -ItemType Directory -Force pc-bios | Out-Null; Get-ChildItem qemudll\pc-bios | Move-Item -Destination pc-bios -Force }
          if (Test-Path pc-bios) { Get-ChildItem pc-bios | Format-Table Name, Length }
          Get-ChildItem *.dll | Format-Table Name, Length

      - name: Get ANGLE (OpenGL ES on Direct3D 11) for the graphics test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/ANGLE.WindowsStore/2.1.13" -OutFile angle.zip
          Expand-Archive angle.zip angle-pkg -Force
          $all = Get-ChildItem angle-pkg -Recurse -File | Where-Object { $_.Extension -in ".dll", ".winmd" }
          $list = ($all | ForEach-Object { $_.FullName.Substring((Resolve-Path angle-pkg).Path.Length) + " (" + $_.Length + ")" }) -join " | "
          Write-Host "::notice title=ANGLE package files::$list"
          $egl = $all | Where-Object { $_.Name -eq "libEGL.dll" -and $_.FullName -match "x64" } | Select-Object -First 1
          $gles = $all | Where-Object { $_.Name -eq "libGLESv2.dll" -and $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $egl -or -not $gles) { Write-Host "::error::Could not find the x64 libEGL.dll / libGLESv2.dll in the ANGLE package"; exit 1 }
          Copy-Item $egl.FullName . -Force
          Copy-Item $gles.FullName . -Force
          Write-Host "Using $($egl.FullName)"
          Write-Host "Using $($gles.FullName)"
          Get-ChildItem libEGL.dll, libGLESv2.dll | Format-Table Name, Length

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find the installed Windows SDK
        shell: powershell
        run: |
          $uap = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Platforms\UAP"
          Write-Host "Looking in: $uap"
          $names = @()
          if (Test-Path $uap) { $names = @(Get-ChildItem $uap | Select-Object -ExpandProperty Name | Sort-Object { [version]$_ } -Descending) }
          Write-Host "UAP platform versions found: $($names -join ', ')"
          $ver = "10.0.26100.0"
          if ($names.Count -gt 0) { $ver = [string]$names[0] }
          Write-Host "Using SDK version: $ver"
          "SDKVER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create a test signing certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Thomas" -KeyUsage DigitalSignature -FriendlyName "XboxVmHost Test" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "xboxdev" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\XboxVmHostTest.cer" | Out-Null

      - name: Restore packages
        run: msbuild XboxVmHost.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /p:TargetPlatformVersion=$env:SDKVER

      - name: Build the app package
        run: >
          msbuild XboxVmHost.csproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:TargetPlatformVersion=$env:SDKVER
          /p:AppxBundle=Never
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\test.pfx"
          /p:PackageCertificatePassword=xboxdev
          /p:AppxPackageDir="$env:GITHUB_WORKSPACE\out\"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: XboxVmHost-package
          retention-days: 14
          path: |
            out/**
            XboxVmHostTest.cer

      - name: Publish a Release (only when asked)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.make_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = ([xml](Get-Content Package.appxmanifest)).Package.Identity.Version
          $all = @(Get-ChildItem out -Recurse -File | Where-Object { $_.Extension -eq '.msix' -or ($_.Extension -eq '.appx' -and $_.FullName -match '[\\/]x64[\\/]') })
          $files = @($all | Sort-Object Name -Unique | ForEach-Object { $_.FullName })
          Write-Host "Release files:"; $files | ForEach-Object { Write-Host $_ }
          $notes = "Install Other OS $ver. Download the .msix file and the three .appx dependency files (x64) from the list below, then install them with the Xbox Device Portal (Apps manager). See the README for the steps."
          $tag = "v$ver-run$($env:GITHUB_RUN_NUMBER)"
          $out = & gh release create $tag @files --repo $env:GITHUB_REPOSITORY --title "Install Other OS $ver" --notes $notes 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $msg = ($out -replace "\r?\n", " | ")
            Write-Host "::error title=Release failed::$msg"
            exit 1
          }
